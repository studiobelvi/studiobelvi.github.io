<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Studio Belvi - Immersion</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link
      rel="icon"
      type="image/svg+xml"
      href="assets/images/logo/favicon.svg"
  >
  
  <style>
    :root {
      --paper: #f7f3ee;
      --bone: #e9dfd2;
      --ink: #1d1a18;
      --espresso: #3a2f2a;
      --bronze: #834C35;
      --oxblood: #572430;
      --taupe: #bba4a4;
      --soft-shadow: 0 18px 50px rgba(45,30,25,0.12);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--paper);
      color: var(--ink);
      line-height: 1.7;
      overflow-x: hidden;
    }

    h1, h2, h3, h4 {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 600;
      letter-spacing: 0.02em;
    }

    img {
      max-width: 100%;
      display: block;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    .container {
      width: min(1200px, 92%);
      margin: auto;
    }

    /* NAV */

    nav {
      position: fixed;
      width: 100%;
      top: 0;
      z-index: 1000;
      background: var(--oxblood);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(0,0,0,0.05);
    }

    .nav-wrapper {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.2rem 0;
    }

    .logo {
        display: flex;
        align-items: center;
        text-decoration: none;
    }
    
    .logo-image {
        height: 60px;
        width: auto;
        transition:
            transform 0.3s ease,
            opacity 0.3s ease;
    }
    
    .logo:hover .logo-image {
        transform: scale(1.03);
        opacity: 0.9;
    }

    .nav-links {
      display: flex;
      gap: 2rem;
      font-size: 0.95rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--bone);
    }

    .nav-links a {
      position: relative;
    }

    .nav-links a::after {
      content: '';
      position: absolute;
      left: 0;
      bottom: -4px;
      width: 0%;
      height: 1px;
      background: var(--bone);
      transition: 0.3s ease;
    }

    .nav-links a:hover::after {
      width: 100%;
    }


    /* SECTIONS */

    section {
      padding: 7rem 0;
    }

    .section-header {
      max-width: 760px;
      margin-bottom: 4rem;
    }

    .section-header span {
      text-transform: uppercase;
      letter-spacing: 0.18em;
      color: var(--espresso);
      font-size: 0.8rem;
    }

    .section-header h2 {
      font-size: clamp(2.8rem, 5vw, 4.8rem);
      line-height: 1;
      margin: 1rem 0;
    }

    .section-header p {
      color: var(--ink);
      font-size: 1.05rem;
    }

    /* PORTFOLIO */

    .portfolio-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 2rem;
    }

    .portfolio-item {
        perspective: 1500px;
        height: 300px;
    }
    
    .portfolio-card {
        position: relative;
        width: 100%;
        height: 100%;
        transition: transform 0.8s ease;
        transform-style: preserve-3d;
    }
    
    .portfolio-item:hover .portfolio-card {
        transform: rotateY(180deg);
    }
    .portfolio-card-front,
    .portfolio-card-back {
        position: absolute;
        inset: 0;
        border-radius: 28px;
        overflow: hidden;
        backface-visibility: hidden;
        box-shadow: var(--soft-shadow);
    }

    .portfolio-card-front {
        background: white;
    }
    
    .portfolio-card-front img {
        width: 100%;
        height: 100%;
        object-fit: cover;
    }
    
    .portfolio-overlay {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: flex-end;
        padding: 2rem;
        background:
            linear-gradient(
                to top,
                rgba(0,0,0,0.55),
                transparent 50%
            );
        color: white;
    }
    
    .portfolio-overlay h3 {
        font-size: 2rem;
        margin: 0;
    }

    .portfolio-card-back {
        transform: rotateY(180deg);
        background: var(--paper);
        backdrop-filter: blur(16px);
        padding: 2rem;
        display: flex;
        flex-direction: column;
        justify-content: center;
        color: var(--ink);
    }
    
    .portfolio-card-back h3 {
        font-size: 2rem;
        margin-bottom: 1rem;
    }
    
    .portfolio-card-back p {
        line-height: 1.7;
        margin-bottom: 2rem;
        color: rgba(43,38,36,0.8);
    }

    .portfolio-button {
        align-self: flex-start;
        padding: 0.9rem 1.4rem;
        border-radius: 999px;
        background:
            linear-gradient(
                135deg,
                var(--burgundy),
                var(--bronze)
            );
        color: white;
        text-decoration: none;
        transition: all 0.3s ease;
    }
    
    .portfolio-button:hover {
        transform: translateY(-2px);
        opacity: 0.9;
    }   

    .portfolio-content {
      text-shadow: 0 2px 12px rgba(0,0,0,0.45);
      position: relative;
      z-index: 1;
    }

    .portfolio-content h3 {
      font-size: 2.4rem;
      margin-bottom: 0.5rem;
    } 

    /* FOOTER */

    footer {
      padding: 3rem 0;
      text-align: center;
      color: var(--espresso);
    }

    /* REVEAL ANIMATION */

    .reveal {
      opacity: 0;
      transform: translateY(40px);
      transition: all 1s ease;
    }

    .reveal.active {
      opacity: 1;
      transform: translateY(0);
    }

    /* RESPONSIVE */

    @media (max-width: 980px) {
      .hero-grid,
      .services-grid,
      .portfolio-grid,
      .process-grid {
        grid-template-columns: 1fr;
      }

      .hero {
        padding: 8rem 0 4rem;
      }

      .hero-visual {
        height: 500px;
      }

      .nav-links {
        display: none;
      }

      .process {
        padding: 2rem;
      }
    }

    @media (max-width: 640px) {
      .hero-text h1 {
        font-size: 4rem;
      }

      .shape-3 {
        width: 60%;
      }

      section {
        padding: 5rem 0;
      }
    }

    @media (max-width: 768px) {
        .logo-image {
            height: 42px;
        }
    }
  </style>
</head>

<body>

  <nav>
    <div class="container nav-wrapper">
      <a href="index.html" class="logo">
        <img
          src="assets/images/logo/logo-bone-textoderecha.svg"
          alt="Studio Belvi"
          class="logo-image"
        >
      </a>


        <select id="language-switcher" style="padding:0.7rem 1rem; border-radius:999px; border:1px solid rgba(0,0,0,0.08); background:var(--bone); font-family:'Inter', sans-serif; cursor:pointer;">
          <option value="en">EN</option>
          <option value="es">ES</option>
          <option value="ca">CA</option>
        </select>

    </div>
  </nav>

  <section id="portfolio">
    <div class="container">
      <div class="section-header reveal">
        <h2 data-i18n="header_title">Immersion</h2>
      </div>
      
      
      <div class="portfolio-grid">

        <div class="portfolio-item reveal">
            <div class="portfolio-card">
                <div class="portfolio-card-front">
                    <img src="./assets/images/immersion/imm1.webp" alt="Immersion">
                </div>
        
                <div class="portfolio-card-back">
                    <h3 data-i18n="card01_text">A very special musical bingo</h3>
                </div>
            </div>
        </div>

        <div class="portfolio-item reveal">
            <div class="portfolio-card">
                <div class="portfolio-card-front">
                    <img src="./assets/images/immersion/imm2.webp" alt="Immersion">
                </div>
        
                <div class="portfolio-card-back">
                    <h3 data-i18n="card02_text">Candle-lit dancing setup</h3>
                </div>
            </div>
        </div>

        <div class="portfolio-item reveal">
            <div class="portfolio-card">
                <div class="portfolio-card-front">
                    <img src="./assets/images/immersion/imm3.webp" alt="Immersion">
                </div>
        
                <div class="portfolio-card-back">
                    <h3 data-i18n="card03_text">Bridal party ceremonial moments</h3>
                </div>
            </div>
        </div>

        <div class="portfolio-item reveal">
            <div class="portfolio-card">
                <div class="portfolio-card-front">
                    <img src="./assets/images/immersion/imm4.webp" alt="Immersion">
                </div>
        
                <div class="portfolio-card-back">
                    <h3 data-i18n="card04_text">Miniature cherry tree as a guest book</h3>
                </div>
            </div>
        </div>

        <div class="portfolio-item reveal">
            <div class="portfolio-card">
                <div class="portfolio-card-front">
                    <img src="./assets/images/immersion/imm5.webp" alt="Immersion">
                </div>
        
                <div class="portfolio-card-back">
                    <h3 data-i18n="card05_text">Treasure hunt</h3>
                </div>
            </div>
        </div>
        
        
      </div>
    </div>
  </section>

  <footer>
    <div class="container">
      <p data-i18n="footer_text">Studio Belvi — Crafted for meaningful moments.</p>
    </div>
  </footer>

  <script>
    const translations = {
      en: {
        header_title: 'Immersion',
        card01_text: 'A very special musical bingo',
        card02_text: 'Candle-lit dancing setup',
        card03_text: 'Bridal party ceremonial moments',
        card04_text: 'Miniature cherry tree as a guest book',
        card05_text: 'Treasure hunt',
        footer_text: 'Studio Belvi — Crafted for meaningful moments.'
      },
      es: {
        header_title: 'Inmersión',
        card01_text: 'Bingo musical muy especial',
        card02_text: 'Pista de baile ambientada con velas',
        card03_text: 'Ceremonia de entrega con las damas de honor',
        card04_text: 'Cerezo en miniatura como libro de firmas',
        card05_text: 'Búsqueda del tesoro',
        footer_text: 'studio BELVI — Creamos momentos memorables'
      },
      ca: {
        header_title: 'Immersió',
        card01_text: 'Bingo musical molt especial',
        card02_text: 'Pista de ball ambientada amb espelmes',
        card03_text: 'Cerimònia de lliurament amb les dames d’honor',
        card04_text: 'Cirerer en miniatura com a llibre de signatures',
        card05_text: 'Cerca del tresor',
        footer_text: 'Studio Belvi — Creem moments memorables'
      }
    };

    const languageSwitcher = document.getElementById('language-switcher');

    function updateLanguage(lang) {
      document.querySelectorAll('[data-i18n]').forEach((element) => {
        const key = element.getAttribute('data-i18n');
        if (translations[lang] && translations[lang][key]) {
          element.innerHTML = translations[lang][key];
        }
      });

      localStorage.setItem('studioBelviLanguage', lang);
    }

    languageSwitcher.addEventListener('change', (e) => {
      updateLanguage(e.target.value);
    });

    const savedLanguage = localStorage.getItem('studioBelviLanguage') || 'en';
    languageSwitcher.value = savedLanguage;
    updateLanguage(savedLanguage);

    const reveals = document.querySelectorAll('.reveal');

    const observer = new IntersectionObserver((entries) => {
      entries.forEach((entry) => {
        if (entry.isIntersecting) {
          entry.target.classList.add('active');
        }
      });
    }, {
      threshold: 0.15
    });

    reveals.forEach((el) => observer.observe(el));
  </script>

</body>
</html>
